name: Publish Nuget Package
on:
  release:
    types: [published]
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Nerdbank.GitVersioning can compute the version
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Build with dotnet
        run: dotnet build --configuration Release
      - name: Test with dotnet
        run: dotnet test

  deploy:
    needs: build
    runs-on: windows-latest
    permissions:
      id-token: write
    environment: nuget-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Nerdbank.GitVersioning can compute the version
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Pack nuget Package
        run: dotnet pack --configuration Release
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push package to nuget
        run: dotnet nuget push **/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
